name: Bug report
description: Something looks or behaves wrong
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Which component or page? For example TextField, AddressForm, or the full checkout.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. A screenshot or recording helps a lot.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For example Firefox 140 on Windows 11, or Safari on an iPhone 15.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it
      options:
        - The live demo
        - Running the repo locally
        - In my own app
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screen reader, reduced motion, right-to-left, a custom theme, or anything else that might matter.
